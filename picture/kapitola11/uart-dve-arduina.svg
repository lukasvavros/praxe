<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="ttl des"><title id="ttl">Propojení UART mezi dvěma deskami Arduino Uno</title><desc id="des">TX D1 prvního Arduina se propojí s RX D0 druhého. RX D0 prvního Arduina s TX D1 druhého. GND se propojí s GND.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#087c89" stroke-width="1.8"/></marker></defs><rect width="1120" height="490" rx="20" fill="#fff"/><text x="50" y="58" fill="#0d5b65" font-size="30" font-weight="750" font-family="Verdana,sans-serif">Dvě Arduina – propojení TX / RX</text><g font-family="Verdana,sans-serif"><rect x="60" y="100" width="310" height="290" rx="22" fill="#e8f6f5" stroke="#0a858b" stroke-width="4"/><rect x="750" y="100" width="310" height="290" rx="22" fill="#e8f6f5" stroke="#0a858b" stroke-width="4"/><text x="215" y="153" text-anchor="middle" font-size="24" font-weight="750" fill="#095964">Arduino A</text><text x="905" y="153" text-anchor="middle" font-size="24" font-weight="750" fill="#095964">Arduino B</text><text x="95" y="190" font-size="15" fill="#54858a">Řídicí deska</text><text x="786" y="190" font-size="15" fill="#54858a">Přijímací deska</text><g font-size="21" font-weight="750" fill="#124a55"><text x="285" y="234">TX · D1</text><text x="285" y="287">RX · D0</text><text x="285" y="342">GND</text><text x="790" y="234">RX · D0</text><text x="790" y="287">TX · D1</text><text x="790" y="342">GND</text></g><g fill="#fff" stroke="#0d6972" stroke-width="3"><circle cx="370" cy="224" r="10"/><circle cx="370" cy="277" r="10"/><circle cx="370" cy="332" r="10"/><circle cx="750" cy="224" r="10"/><circle cx="750" cy="277" r="10"/><circle cx="750" cy="332" r="10"/></g><path d="M380 224 C500 224 620 277 740 277" stroke="#e2802c" stroke-width="7" fill="none"/><path d="M380 277 C500 277 620 224 740 224" stroke="#109ba4" stroke-width="7" fill="none"/><path d="M380 332H740" stroke="#475d61" stroke-width="7" fill="none"/><text x="560" y="211" text-anchor="middle" fill="#117981" font-size="16">data druhým směrem</text><text x="560" y="313" text-anchor="middle" fill="#bf6c1b" font-size="16">data prvním směrem</text><text x="560" y="364" text-anchor="middle" fill="#56696d" font-size="16">společná zem</text><rect x="60" y="410" width="1000" height="48" rx="10" fill="#fff6e9"/><text x="560" y="440" fill="#80531d" font-size="17" text-anchor="middle">Uno/Nano: D0 a D1 používá i hardwarová linka USB ↔ Serial. Při nahrávání odpoj druhou desku.</text></g></svg>