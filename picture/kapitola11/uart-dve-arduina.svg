<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title description">
  <title id="title">Správné křížené zapojení UART mezi dvěma Arduiny Uno</title>
  <desc id="description">TX na D1 Arduina A vede do RX na D0 Arduina B. TX na D1 Arduina B vede do RX na D0 Arduina A. GND obou desek jsou společné. Přenosová rychlost a logické úrovně musejí být kompatibilní.</desc>
  <defs>
    <marker id="markerOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#d47b23"/>
    </marker>
    <marker id="markerTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#148d9b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="490" rx="18" fill="#ffffff"/>
  <text x="44" y="58" fill="#105861" font-size="29" font-weight="700" font-family="Arial,DejaVu Sans,sans-serif">Dvě Arduina – správné propojení TX / RX</text>
  <text x="44" y="87" fill="#4d6970" font-size="17" font-family="Arial,DejaVu Sans,sans-serif">Sériová komunikace UART na Arduino Uno / Nano (5V logika)</text>
  <g font-family="Arial,DejaVu Sans,sans-serif">
    <!-- Dvě desky; obě mohou vysílat i přijímat. -->
    <rect x="52" y="113" width="333" height="268" rx="20" fill="#ebf7f5" stroke="#168890" stroke-width="3"/>
    <rect x="735" y="113" width="333" height="268" rx="20" fill="#ebf7f5" stroke="#168890" stroke-width="3"/>
    <text x="217" y="155" text-anchor="middle" fill="#0e5861" font-size="26" font-weight="700">Arduino A</text>
    <text x="901" y="155" text-anchor="middle" fill="#0e5861" font-size="26" font-weight="700">Arduino B</text>
    <text x="217" y="178" text-anchor="middle" fill="#58787e" font-size="16">vysílá i přijímá</text>
    <text x="901" y="178" text-anchor="middle" fill="#58787e" font-size="16">vysílá i přijímá</text>

    <!-- 3 odpovídající vývody (na obou deskách stejné pozice). -->
    <g font-size="22" font-weight="700">
      <text x="280" y="223" text-anchor="end" fill="#b9651c">TX · D1</text>
      <text x="280" y="292" text-anchor="end" fill="#107986">RX · D0</text>
      <text x="280" y="354" text-anchor="end" fill="#425d63">GND</text>
      <text x="786" y="223" fill="#b9651c">TX · D1</text>
      <text x="786" y="292" fill="#107986">RX · D0</text>
      <text x="786" y="354" fill="#425d63">GND</text>
    </g>

    <!-- Fyzické vodiče se na obrázku kříží, ale NESPOJUJÍ SE v průsečíku! -->
    <path d="M385 282 C503 282 615 212 735 212" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <path d="M735 212 C615 212 503 282 385 282" fill="none" stroke="#148d9b" stroke-width="7" stroke-linecap="round" marker-end="url(#markerTeal)"/>
    <path d="M385 212 C503 212 615 282 735 282" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <path d="M385 212 C503 212 615 282 735 282" fill="none" stroke="#d47b23" stroke-width="7" stroke-linecap="round" marker-end="url(#markerOrange)"/>
    <path d="M385 345 H735" fill="none" stroke="#485d63" stroke-width="7" stroke-linecap="round"/>

    <!-- Popisky směrů jsou mimo vodiče, nepletou se do křížení. -->
    <rect x="484" y="174" width="151" height="30" rx="15" fill="#fff6eb"/>
    <text x="560" y="195" font-size="17" font-weight="700" text-anchor="middle" fill="#a65a16">A → B</text>
    <rect x="484" y="298" width="151" height="30" rx="15" fill="#eaf8fa"/>
    <text x="560" y="319" font-size="17" font-weight="700" text-anchor="middle" fill="#087986">B → A</text>
    <text x="560" y="374" text-anchor="middle" font-size="15" fill="#485d63">společná zem</text>

    <!-- Kontakty jsou zakresleny až přes vodiče, aby byly vývody jasné. -->
    <g fill="#fff" stroke-width="3.2">
      <g stroke="#b9651c">
        <circle cx="385" cy="212" r="8"/>
        <circle cx="735" cy="212" r="8"/>
      </g>
      <g stroke="#107986">
        <circle cx="385" cy="282" r="8"/>
        <circle cx="735" cy="282" r="8"/>
      </g>
      <g stroke="#425d63">
        <circle cx="385" cy="345" r="8"/>
        <circle cx="735" cy="345" r="8"/>
      </g>
    </g>
    <!-- Přehled bez rušení samotného propojení. -->
    <rect x="52" y="404" width="1016" height="54" rx="11" fill="#eef7f6"/>
    <text x="560" y="426" fill="#275b61" font-size="17" text-anchor="middle" font-weight="700">TX (D1) ↔ RX (D0)  ·  RX (D0) ↔ TX (D1)  ·  GND ↔ GND</text>
    <text x="560" y="449" fill="#4e6b70" font-size="15" text-anchor="middle">Piny D0/D1 sdílí na Uno také USB převodník – při nahrávání může být nutné propojení odpojit.</text>
  </g>
</svg>
