<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 380" role="img" aria-labelledby="title desc"><title id="title">Rámec UART 8N1</title><desc id="desc">Klidová úroveň 1, start bit 0, osm datových bitů odesílaných od nejnižšího bitu a stop bit 1. Ukázkové písmeno S, hexadecimálně 53.</desc><rect width="1240" height="380" rx="24" fill="#ffffff"/><text x="58" y="56" fill="#0c5e68" font-family="Verdana, sans-serif" font-size="27" font-weight="800">Jeden přenesený znak · UART 8N1</text><text x="58" y="86" fill="#537980" font-family="Verdana, sans-serif" font-size="16">Příklad: S = 0x53 · 8 datových bitů, žádná parita, 1 stop bit</text><g font-family="Verdana,sans-serif"><text x="132.0" y="119" font-size="16" font-weight="700" text-anchor="middle" fill="#456b70">klid</text><rect x="174" y="130" width="84" height="142" fill="#eefbf9" stroke="#d7e6e5"/><text x="216.0" y="119" font-size="17" font-weight="750" text-anchor="middle" fill="#125b64">start</text><text x="216.0" y="297" font-size="15" text-anchor="middle" fill="#456b70">0</text><rect x="258" y="130" width="84" height="142" fill="#f7fafb" stroke="#d7e6e5"/><text x="300.0" y="119" font-size="17" font-weight="750" text-anchor="middle" fill="#125b64">b0</text><text x="300.0" y="297" font-size="15" text-anchor="middle" fill="#456b70">1</text><rect x="342" y="130" width="84" height="142" fill="#eefbf9" stroke="#d7e6e5"/><text x="384.0" y="119" font-size="17" font-weight="750" text-anchor="middle" fill="#125b64">b1</text><text x="384.0" y="297" font-size="15" text-anchor="middle" fill="#456b70">1</text><rect x="426" y="130" width="84" height="142" fill="#f7fafb" stroke="#d7e6e5"/><text x="468.0" y="119" font-size="17" font-weight="750" text-anchor="middle" fill="#125b64">b2</text><text x="468.0" y="297" font-size="15" text-anchor="middle" fill="#456b70">0</text><rect x="510" y="130" width="84" height="142" fill="#eefbf9" stroke="#d7e6e5"/><text x="552.0" y="119" font-size="17" font-weight="750" text-anchor="middle"