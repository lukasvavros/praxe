dana,sans-serif" font-size="16" fill="#54727a">1</text><text x="42" y="253" font-family="Verdana,sans-serif" font-size="16" fill="#54727a">0</text><text x="58" y="341" font-family="Verdana,sans-serif" font-size="16" fill="#516f74">Na Arduinu se přenášejí jednotlivé bity postupně; obě strany musí mít shodnou rychlost (např. 9600 Bd).</text></svg>