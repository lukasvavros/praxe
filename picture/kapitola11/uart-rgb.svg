<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 530" role="img" aria-labelledby="ttl desc"><title id="ttl">Dvě Arduina – tři potenciometry a RGB LED</title><desc id="desc">Na prvním Arduinu jsou potenciometry na A0, A1, A2. TX D1 první desky jde do RX D0 druhé. RX D0 první desky jde do TX D1 druhé. GND spojeno. Druhá deska řídí RGB LED pomocí PWM na D9, D10, D11 přes tři rezistory.</desc><rect width="1160" height="530" rx="20" fill="#fff"/><g font-family="Verdana,sans-serif"><text x="45" y="56" font-size="30" font-weight="800" fill="#125d67">Úloha: potenciometry / UART / RGB LED</text><rect x="55" y="98" width="445" height="295" rx="20" fill="#e8f7f5" stroke="#088b8d" stroke-width="3"/><rect x="665" y="98" width="445" height="295" rx="20" fill="#e8f7f5" stroke="#088b8d" stroke-width="3"/><text x="275" y="141" text-anchor="middle" font-size="24" font-weight="700" fill="#0b646d">Arduino A · odesílá</text><text x="885" y="141" text-anchor="middle" font-size="24" font-weight="700" fill="#0b646d">Arduino B · přijímá</text><g font-size="18" fill="#305c61"><text x="80" y="198">A0</text><text x="80" y="255">A1</text><text x="80" y="312">A2</text><text x="760" y="198">D9 · R</text><text x="760" y="255">D10 · G</text><text x="760" y="312">D11 · B</text></g><g fill="#fff" stroke="#617779" stroke-width="3"><circle cx="185" cy="192" r="22"/><circle cx="185" cy="250" r="22"/><circle cx="185" cy="308" r="22"/></g><g stroke="#186d79" stroke-width="4"><path d="M185 192l15-15M185 250l0-18M185 308l-14-14"/></g><g font-size="16" fill="#536d71"><text x="224" y="198">potenciometr 1</text><text x="224" y="255">potenciometr 2</text><text x="224" y="312">potenciometr 3</text></g><path d="M855 192H937 M855 249H937 M855 305H937" stroke="#9a9fa3" stroke-width="5"/><g fill="#f5efdc" stroke="#606d77" stroke-width="2"><rect x="890" y="181" width="37" height="21" rx="4"/><rect x="890" y="239" width="37" height="21" rx="4"/><rect x="890" y="295" width="37" height="21" rx="4"/></g><rect x="948" y="169" width="50" height="167" rx="25" fill="none" stroke="#74898a" stroke-width="2.5" stroke-dasharray="5 5"/><g fill="#e85d4f"><circle cx="972" cy="192" r="16"/></g><circle cx="972" cy="249" r="16" fill="#35be75"/><circle cx="972" cy="305" r="16" fill="#428adf"/><path d="M500 205 C575 205 590 265 665 265" stroke="#e58a34" stroke-width="6" fill="none"/><path d="M500 265 C575 265 590 205 665 205" stroke="#118f9b" stroke-width="6" fill="none"/><path d="M500 350 H665" stroke="#53646b" stroke-width="7" fill="none"/><text x="570" y="181" font-size="17" fill="#0d6f79">TX ↔ RX</text><text x="567" y="335" font-size="17" fill="#53646b">GND</text><rect x="55" y="416" width="1055" height="77" rx="12" fill="#f2faf9" stroke="#cfe7e4"/><text x="75" y="446" font-size="18" font-weight="700" fill="#0c6570">Přenos: R,G,B (0–255) + nový řádek</text><text x="75" y="475" font-size="16" fill="#3a696e">Společná katoda RGB LED na GND; každý kanál má vlastní předřadný rezistor 220–330 Ω.</text></g></svg>