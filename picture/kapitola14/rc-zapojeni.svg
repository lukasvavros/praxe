<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title"><title id="title">Schéma RC obvodu s LED zátěží</title><rect width="1100" height="450" rx="22" fill="#f8fcfb"/><text x="67" y="63" font-family="Arial" font-size="31" font-weight="700" fill="#11666a">Nabíjení a vybíjení kondenzátoru</text><rect x="70" y="165" width="154" height="75" rx="12" fill="#e3f6f0" stroke="#148a86" stroke-width="4"/><text x="147" y="211" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#0d676a">0 / 5 V</text><path d="M224 202 H355" fill="none" stroke="#cf713b" stroke-width="7"/><rect x="355" y="182" width="185" height="40" rx="7" fill="#ffe5b8" stroke="#a96827" stroke-width="4"/><text x="448" y="168" text-anchor="middle" font-family="Arial" font-size="25" fill="#8b581f">R1 = 1 kΩ</text><path d="M540 202 H660 V255 M660 202 H880 V245" fill="none" stroke="#cf713b" stroke-width="7"/><circle cx="660" cy="202" r="9" fill="#b65b2f"/><path d="M606 255 H714 M606 277 H714" stroke="#237b89" stroke-width="8"/><path d="M660 277 V356" stroke="#516b70" stroke-width="7"/><path d="M621 356 H699 M632 370 H688 M646 384 H674" stroke="#516b70" stroke-width="5"/><text x="727" y="270" font-family="Arial" font-size="25" font-weight="700" fill="#11666a">C1</text><text x="727" y="303" font-family="Arial" font-size="21" fill="#5d7278">kondenzátor</text><rect x="857" y="245" width="46" height="62" fill="#ffe5b8" stroke="#a96827" stroke-width="4" rx="5"/><text x="928" y="285" font-family="Arial" font-size="22" fill="#7e562b">R2</text><path d="M880 307 V325" stroke="#516b70" stroke-width="6"/><path d="M847 325 L913 325 L880 362 Z" fill="#f3b251" stroke="#b77727" stroke-width="4"/><path d="M845 365 H915 M880 365 V394" stroke="#516b70" stroke-width="6"/><path d="M840 394 H920 M851 408 H909 M863 422 H897" stroke="#516b70" stroke-width="4"/><text x="948" y="357" font-family="Arial" font-size="24" fill="#a96827">LED</text><text x="67" y="350" font-family="Arial" font-size="23" fill="#4f6a70">Rezistor omezuje proud, kondenzátor ukládá náboj.</text><text x="67" y="384" font-family="Arial" font-size="20" fill="#687a81">LED představuje další zátěž: průběh se může lišit od ideálního RC.</text></svg>
