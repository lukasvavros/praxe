<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="feedback-title feedback-desc"><title id="feedback-title">Jak funguje zpětná vazba</title><desc id="feedback-desc">Arduino zadá požadovanou polohu. Elektronika uvnitř serva porovnává požadovaný úhel s polohou snímanou potenciometrem a podle odchylky řídí motor.</desc><defs><marker id="feedback-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ee7203"/></marker><marker id="feedback-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#38618a"/></marker><marker id="feedback-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#737984"/></marker></defs><g font-family="Verdana,Arial,sans-serif" fill="#373841"><rect x="103" y="12" width="354" height="52" rx="10" fill="#fff4e8" stroke="#ee7203" stroke-width="2"/><text x="280" y="35" text-anchor="middle" font-size="15" fill="#373841" font-weight="bold">Arduino</text><text x="280" y="53" text-anchor="middle" font-size="12" fill="#373841">povel: požadovaná poloha</text><rect x="69" y="99" width="436" height="267" rx="16" fill="#f7f8fa" stroke="#d8dce2" stroke-dasharray="5 4"/><text x="485" y="119" text-anchor="end" font-size="10" fill="#767c85">UVNITŘ SERVA</text><path d="M280 65V123" fill="none" stroke="#ee7203" stroke-width="2.5" marker-end="url(#feedback-orange)"/><text x="291" y="86" text-anchor="start" font-size="11" fill="#a84b00">řídicí impulzy</text><rect x="117" y="130" width="326" height="56" rx="10" fill="white" stroke="#ee7203" stroke-width="2"/><text x="280" y="153" text-anchor="middle" font-size="14" fill="#373841" font-weight="bold">Řídicí elektronika</text><text x="280" y="173" text-anchor="middle" font-size="11" fill="#373841">porovná požadovaný a změřený úhel</text><rect x="117" y="213" width="326" height="56" rx="10" fill="white" stroke="#737984" stroke-width="2"/><text x="280" y="236" text-anchor="middle" font-size="14" fill="#373841" font-weight="bold">Motor → převodovka → osa</text><text x="280" y="256" text-anchor="middle" font-size="11" fill="#373841">změní polohu ramene</text><rect x="117" y="296" width="326" height="56" rx="10" fill="#edf3f9" stroke="#38618a" stroke-width="2"/><text x="280" y="319" text-anchor="middle" font-size="14" fill="#373841" font-weight="bold">Potenciometr</text><text x="280" y="339" text-anchor="middle" font-size="11" fill="#373841">změří aktuální polohu</text><path d="M280 188V207" fill="none" stroke="#ee7203" stroke-width="2.5" marker-end="url(#feedback-orange)"/><path d="M280 271V290" fill="none" stroke="#737984" stroke-width="2.5" marker-end="url(#feedback-gray)"/><path d="M117 324H37V158H110" fill="none" stroke="#38618a" stroke-width="2.5" marker-end="url(#feedback-blue)"/><text x="24" y="246" text-anchor="middle" font-size="12" fill="#38618a" transform="rotate(-90 24 246)">zpětná vazba</text></g></svg>